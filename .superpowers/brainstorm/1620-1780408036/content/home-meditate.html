<h2>首页 & 冥想引导 — 视觉设计</h2>
<p class="subtitle">第一印象 + 仪式感，决定用户是否愿意进入测评</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">首页 — 森林之门</div>
    <div class="mockup-body" style="padding: 20px; background: #061206; min-height: 400px; position: relative; overflow: hidden;">
      <!-- 极光背景示意 -->
      <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 0%, rgba(40,100,60,0.3) 0%, transparent 60%), radial-gradient(ellipse at 30% 60%, rgba(20,80,40,0.2) 0%, transparent 50%), linear-gradient(180deg, #061206, #0a1a0a);"></div>

      <!-- 萤火虫光点 -->
      <div style="position: absolute; top: 20%; left: 25%; width: 4px; height: 4px; background: #a0d0a0; border-radius: 50%; box-shadow: 0 0 8px #80c080;"></div>
      <div style="position: absolute; top: 40%; right: 30%; width: 3px; height: 3px; background: #c0e0c0; border-radius: 50%; box-shadow: 0 0 6px #a0d0a0;"></div>
      <div style="position: absolute; top: 60%; left: 50%; width: 4px; height: 4px; background: #90c090; border-radius: 50%; box-shadow: 0 0 10px #80b080;"></div>

      <!-- 森林之门 -->
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; margin-top: 60px;">
        <div style="font-size: 64px; filter: drop-shadow(0 0 20px rgba(100,200,100,0.4));">🌳</div>
        <div style="font-size: 28px; color: #c4f0c4; font-weight: bold; margin-top: 16px; letter-spacing: 4px;">森林之旅</div>
        <div style="font-size: 14px; color: #9ad0a0; margin-top: 4px;">Forest Journey</div>
        <div style="width: 80px; height: 1px; background: linear-gradient(90deg, transparent, #4a8a4a, transparent); margin: 20px 0;"></div>
        <p style="color: #aaa; font-size: 13px; text-align: center; max-width: 240px;">
          一次深入心灵的森林探索<br/>发现你的服务者原型
        </p>
        <button class="mock-button" style="margin-top: 24px; background: linear-gradient(135deg, #2a5a3a, #3a7a4a); color: #fff; font-size: 16px; padding: 14px 36px; border-radius: 24px;">
          开启心灵之旅 ✦
        </button>
      </div>

      <!-- 底部导航 -->
      <div style="position: absolute; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-around; padding: 12px; background: rgba(6,18,6,0.9); border-top: 1px solid #1a2a1a;">
        <div style="text-align: center; color: #c4f0c4;">
          <div style="font-size: 18px;">🗺️</div>
          <div style="font-size: 10px;">探索</div>
        </div>
        <div style="text-align: center; color: #555;">
          <div style="font-size: 18px;">🧭</div>
          <div style="font-size: 10px;">发现</div>
        </div>
        <div style="text-align: center; color: #888;">
          <div style="font-size: 18px;">👤</div>
          <div style="font-size: 10px;">我的</div>
        </div>
      </div>
    </div>
  </div>

  <div class="mockup">
    <div class="mockup-header">冥想引导 — 呼吸光晕</div>
    <div class="mockup-body" style="padding: 20px; background: #020602; min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">
      <!-- 暗背景 -->
      <div style="position: absolute; inset: 0; background: radial-gradient(circle, rgba(20,40,20,0.4) 0%, #020602 70%);"></div>

      <!-- 呼吸光晕 -->
      <div style="position: relative; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(100,200,100,0.5), rgba(60,140,60,0.2), transparent 70%); box-shadow: 0 0 40px rgba(80,160,80,0.4);"></div>
      <p style="position: relative; color: #888; font-size: 11px; margin-top: 16px;">呼吸光晕缩放循环 4s</p>

      <!-- 引导文字 -->
      <div style="position: relative; margin-top: 32px; text-align: center;">
        <p style="color: #9ad0a0; font-size: 14px; max-width: 260px; line-height: 1.8;">
          "闭上眼睛，深呼吸。<br/>想象自己站在一片古老森林的边缘……"
        </p>
      </div>

      <!-- 倒计时 + 跳过 -->
      <div style="position: relative; margin-top: 40px; display: flex; gap: 24px; align-items: center;">
        <span style="color: #666; font-size: 14px;">⏱ 0:42</span>
        <button class="mock-button" style="opacity: 0.6;">跳过 ›</button>
      </div>
    </div>
  </div>
</div>
